name: Cloud Deploy

# Veröffentlicht den Worker bei Cloudflare, sobald sich etwas an cloud/ oder der Web-Oberfläche ändert.
# Voraussetzung: Repository-Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID (siehe cloud/README.md).
on:
  push:
    branches: [main]
    paths: ["cloud/**", "app/src/main/assets/web/**", ".github/workflows/cloud-deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    name: Worker + D1 ausrollen
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUD_DEPLOY_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80   # für das Änderungsprotokoll
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node scripts/changelog.mjs
      - run: npx tsc --noEmit
      - name: Datenbank-Migrationen anwenden
        run: npx wrangler d1 migrations apply binary-brotherhood --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Worker veröffentlichen
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
