name: Android Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK bauen und veröffentlichen
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.BBL_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Version bestimmen
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keystore aus Secret entpacken
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Release-APK bauen
        env:
          BBL_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          BBL_KEYSTORE_PASSWORD: ${{ secrets.BBL_KEYSTORE_PASSWORD }}
          BBL_KEY_ALIAS: ${{ secrets.BBL_KEY_ALIAS }}
          BBL_KEY_PASSWORD: ${{ secrets.BBL_KEY_PASSWORD }}
          BBL_VERSION_CODE: ${{ github.run_number }}
          BBL_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk "BinaryBrotherhood-${{ steps.version.outputs.name }}.apk"

      - name: APK als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: BinaryBrotherhood-${{ steps.version.outputs.name }}
          path: BinaryBrotherhood-*.apk

      - name: Rolling-Release "latest" aufräumen
        if: ${{ steps.version.outputs.tag == 'latest' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag == 'latest' && format('Aktueller Build ({0})', steps.version.outputs.name) || format('Binary Brotherhood {0}', steps.version.outputs.name) }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          # Unsichtbare Marker: der In-App-Updater liest daraus Build-Nummer und Versionsname
          body: |
            <!-- versionCode: ${{ github.run_number }} -->
            <!-- versionName: ${{ steps.version.outputs.name }} -->
          generate_release_notes: true
          files: BinaryBrotherhood-*.apk
