# Worker + Web-App; je Realm ein Durable Object mit SQLite. D1: Realm-Verzeichnis und Konten.
name = "binary-brotherhood"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[assets]
directory = "../app/src/main/assets/web"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "binary-brotherhood"
database_id = "bddfd310-eae0-4798-b9be-8b80d189e25e"
migrations_dir = "migrations"

# Schema je Realm als Text einbinden
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[[durable_objects.bindings]]
name = "REALM"
class_name = "Realm"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Realm"]
deleted_classes = ["Hub"]
